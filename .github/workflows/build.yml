name: Build and verify preview

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Test services and disposable SFTP server
        run: zsh Scripts/test-sftp.sh
      - name: Verify local search with network sockets denied
        run: zsh Scripts/test-local-search-offline.sh
      - name: Verify the single-window UI with Xcode
        run: |
          mkdir -p /private/tmp/MacExUITestFixtures
          xcodebuild -project MacEx.xcodeproj -scheme MacEx -configuration Debug \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath .build/ui-tests \
            build-for-testing
          python3 - <<'PY'
          import plistlib, subprocess
          def entitlements(path):
              data = subprocess.check_output(['codesign', '-d', '--entitlements', ':-', path])
              return plistlib.loads(data) if data.strip() else {}
          key = 'com.apple.security.temporary-exception.files.absolute-path.read-write'
          runner = entitlements('.build/ui-tests/Build/Products/Debug/MacExUITests-Runner.app')
          assert runner.get('com.apple.security.app-sandbox') is True
          assert runner.get(key) == ['/private/tmp/MacExUITestFixtures/']
          assert key not in entitlements('.build/ui-tests/Build/Products/Debug/MacEx.app')
          print('Verified sandboxed test runner has only dedicated fixture write access; app has no fixture entitlement.')
          PY
          xcodebuild -project MacEx.xcodeproj -scheme MacEx -configuration Debug \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath .build/ui-tests \
            -resultBundlePath .build/single-window.xcresult test-without-building
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: MacEx-UI-results
          path: .build/single-window.xcresult
          retention-days: 7
      - name: Prepare universal GitHub preview without notarization
        run: zsh Scripts/package-release.sh --prepare
      - name: Verify bundle and download checksums
        run: |
          test -d dist/release/MacEx.app/Contents/Resources/Metadata.appintents
          codesign --verify --strict --verbose=2 dist/release/MacEx.app
          python3 -c 'import subprocess; assert sorted(subprocess.check_output(["lipo", "-archs", "dist/release/MacEx.app/Contents/MacOS/MacEx"], text=True).split()) == ["arm64", "x86_64"]'
          cd dist
          shasum -a 256 -c MacEx-*-SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MacEx-preview
          path: |
            dist/MacEx-*.dmg
            dist/MacEx-*.zip
            dist/MacEx-*-SHA256SUMS.txt
          retention-days: 14
